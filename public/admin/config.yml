backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # --- СПРАВОЧНИК ПЕРСОНАЖЕЙ ---
  - name: "characters"
    label: "База Персонажей (Иконки)"
    folder: "src/content/characters"
    create: true
    format: "json"
    slug: "{{id}}"
    fields:
      - { label: "ID Персонажа (англ., например: jiyan)", name: "id", widget: "string" }
      - { label: "Имя", name: "name", widget: "string" }
      - { label: "Иконка/Аватар", name: "avatar", widget: "image" }

  # --- СПРАВОЧНИК ОРУЖИЯ ---
  - name: "weapons"
    label: "База Оружия"
    folder: "src/content/weapons"
    create: true
    format: "json"
    slug: "{{id}}"
    fields:
      - { label: "ID Оружия", name: "id", widget: "string" }
      - { label: "Название", name: "name", widget: "string" }
      - { label: "Редкость (звезд)", name: "rarity", widget: "number", value_type: "int" }
      - { label: "Иконка", name: "icon", widget: "image" }

  # --- СПРАВОЧНИК ЭХО ---
  - name: "echoSets"
    label: "База Сетов Эхо"
    folder: "src/content/echoSets"
    create: true
    format: "json"
    slug: "{{id}}"
    fields:
      - { label: "ID Сета", name: "id", widget: "string" }
      - { label: "Название", name: "name", widget: "string" }
      - { label: "Иконка", name: "icon", widget: "image" }

  # --- ПОЛНЫЙ ГАЙД ---
  - name: "guides"
    label: "Гайды"
    folder: "src/content/guides"
    create: true
    fields:
      - { label: "ID Персонажа", name: "characterId", widget: "relation", collection: "characters", search_fields: ["name", "id"], value_field: "id", display_fields: ["name"] }
      - { label: "Заголовок Гайда", name: "title", widget: "string" }
      - { label: "Стихия", name: "element", widget: "select", options: ["Aero", "Spectro", "Fusion", "Conductive", "Glacio", "Havoc"] }
      - { label: "Тип оружия", name: "weaponType", widget: "select", options: ["Broadblade", "Sword", "Pistols", "Gauntlets", "Rectifier"] }
      - { label: "Редкость", name: "rarity", widget: "number", value_type: "int" }
      - { label: "Роль", name: "role", widget: "string" }
      - { label: "Арт персонажа (Full Art)", name: "fullArt", widget: "image" }

      # Статы и приоритеты
      - label: "Базовые статы"
        name: "baseStats"
        widget: "object"
        fields:
          - { label: "HP", name: "hp", widget: "number", value_type: "int" }
          - { label: "ATK", name: "atk", widget: "number", value_type: "int" }
          - { label: "DEF", name: "def", widget: "number", value_type: "int" }

      # --- Приоритет статов (каждый стат отдельным полем с возможностью сортировки) ---
      - label: "Приоритет статов в артефактах"
        name: "statPriorities"
        widget: "list"
        fields:
          - { label: "Название стата (например: Крит. урон, АТК%)", name: "statName", widget: "string" }

      # --- Приоритет прокачки скиллов (с группами равного приоритета) ---
      - label: "Приоритет прокачки скиллов"
        name: "skillPriority"
        widget: "list"
        fields:
          - { label: "Ранг приоритета (например: Приоритет 1, Равнозначно)", name: "tier", widget: "string" }
          - label: "Навыки этого уровня"
            name: "skillsList"
            widget: "list"
            fields:
              - { label: "Название навыка", name: "skill", widget: "string" }

      # Связи с оружием и эхо по ID
      - { label: "Рекомендуемое оружие", name: "recommendedWeapons", widget: "relation", collection: "weapons", multiple: true, search_fields: ["name"], value_field: "id", display_fields: ["name"] }
      - { label: "Рекомендуемые сеты Эхо", name: "recommendedEchoSets", widget: "relation", collection: "echoSets", multiple: true, search_fields: ["name"], value_field: "id", display_fields: ["name"] }

      # Команды (3 картинки персонажей)
      - label: "Рекомендуемые команды"
        name: "teams"
        widget: "list"
        fields:
          - { label: "Название пачки", name: "name", widget: "string" }
          - { label: "Состав (ровно 3 персонажа)", name: "memberIds", widget: "relation", collection: "characters", multiple: true, search_fields: ["name"], value_field: "id", display_fields: ["name"] }

      # Консты
      - label: "Резонансы / Созвездия (Консты)"
        name: "resonances"
        widget: "list"
        fields:
          - { label: "Номер (1-6)", name: "sequence", widget: "number", value_type: "int" }
          - { label: "Название", name: "name", widget: "string" }
          - { label: "Описание работы", name: "description", widget: "text" }
          - { label: "Оценка и полезность", name: "utilityReview", widget: "text" }

      # Скиллсет
      - label: "Способности (Скиллсет)"
        name: "skills"
        widget: "list"
        fields:
          - { label: "Название скилла", name: "name", widget: "string" }
          - { label: "Тип (Normal/Skill/Liberation/Forte)", name: "type", widget: "string" }
          - { label: "Подробное описание", name: "description", widget: "text" }

      - { label: "Текст гайда / Общий гайд", name: "body", widget: "markdown" }